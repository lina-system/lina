name: Blob size check

# LINA CI (docs/ci.md). Runs on pull requests into dev or main and on pushes to dev.
# GitHub-hosted runners only; no upstream organisation secrets, runners or apps.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-blob-size:
    # Rejects a change that adds or modifies a binary over 500 KiB (upstream blob-size-check.yml).
    # Exceptions: .github/blob-size-allowlist.txt.
    name: Blob size check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 2 # a pull request checks out its merge commit; HEAD^1 is the base tip

      - name: Judge files added or modified against the first parent
        run: python3 scripts/ci/check_blob_size.py --base HEAD^1
