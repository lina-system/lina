# SPDX-License-Identifier: AGPL-3.0-only
name: Lint

# LINA CI (docs/ci.md). Runs on pull requests into dev or main and on pushes to dev.
# GitHub-hosted runners only; no upstream organisation secrets, runners or apps.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # Required check. Upstream lint.yml "ruff enforcement (blocking)": the rules in
    # [tool.ruff.lint.select], with the ruff version pinned by scripts/code_health.
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: ./.github/actions/setup-pm
        with:
          cache-python: true
          prune-python-cache: true

      - name: Install pinned ruff
        uses: ./.github/actions/retry
        with:
          command: python -m scripts.ci.python_packages "$(python -m scripts.code_health --print-pins)"

      - name: ruff check .
        run: ruff check .

      - name: Check the checkout is clean
        uses: ./.github/actions/check-clean-worktree
