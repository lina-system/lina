# SPDX-License-Identifier: AGPL-3.0-only
name: Supply chain audit

# LINA CI (docs/ci.md). Runs on pull requests into dev or main and on pushes to dev.
# GitHub-hosted runners only; no upstream organisation secrets, runners or apps.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    # The two critical patterns of upstream supply-chain-audit.yml, on the lines a change adds.
    name: Supply chain audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 2 # a pull request checks out its merge commit; HEAD^1 is the base tip

      - name: Scan added lines for critical patterns
        run: |
          set -euo pipefail
          # Pull request: the merge commit against the base tip. Push to dev: the pushed (merge)
          # commit against its first parent, which is everything the merged pull request added.
          DIFF=$(git diff HEAD^1 HEAD -- . ':!uv.lock' ':!*.lock' ':!package-lock.json' ':!yarn.lock' || true)
          ADDED=$(printf '%s\n' "$DIFF" | grep -n '^+' || true)
          B64=$(printf '%s\n' "$ADDED" | grep -iE 'base64\.(b64decode|decodebytes|urlsafe_b64decode)' | grep -iE 'exec\(|eval\(' | head -10 || true)
          PROC=$(printf '%s\n' "$ADDED" | grep -E 'subprocess\.(Popen|call|run)\s*\(' | grep -iE 'base64|\\x[0-9a-f]{2}|chr\(' | head -10 || true)
          if [ -n "$B64$PROC" ]; then
            [ -z "$B64" ] || printf '::error::base64 decode passed to exec/eval:\n%s\n' "$B64"
            [ -z "$PROC" ] || printf '::error::subprocess with an encoded command:\n%s\n' "$PROC"
            exit 1
          fi
          echo "No critical supply chain patterns in HEAD^1..HEAD"
