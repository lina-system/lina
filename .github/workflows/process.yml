# SPDX-License-Identifier: Apache-2.0
name: Process supervision

on:
  pull_request:
    branches: [dev]
    paths:
      - 'kit/proc/**'
      - 'kit/lease/**'
      - 'kit/go.mod'
      - '.github/workflows/process.yml'

permissions:
  contents: read

concurrency:
  group: process-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native:
    name: process (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out the candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Read Go toolchain
        id: go
        shell: bash
        run: |
          version=$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2; exit }' kit/go.mod)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false
      - name: Exercise native process supervision
        working-directory: kit
        run: go test -race -count=1 -timeout=2m ./proc/...
