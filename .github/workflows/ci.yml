# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  pull_request:
    branches: [dev, 'codex/ln-369-*']
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [dev]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs: newest head only. dev pushes: one run at a time; GitHub keeps only the newest waiting run,
  # so a burst of merges tests the latest dev head instead of every intermediate one.
  group: foundation-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'latest' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      - name: Check out the candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read the Node version
        id: node
        run: |
          if [[ -f .node-version ]]; then
            printf 'version=%s\n' "$(cat .node-version)" >> "$GITHUB_OUTPUT"
          else
            echo 'version=24' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Select checks and shards
        id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          E2E_OPT_IN: ${{ contains(github.event.pull_request.labels.*.name, 'e2e') }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request && -n "$BASE_SHA" ]]; then
            options=(--event pull_request)
            if [[ "$E2E_OPT_IN" == true ]]; then options+=(--e2e); fi
            node scripts/foundation.mjs --range "$BASE_SHA..$HEAD_SHA" "${options[@]}" --no-note --select "$RUNNER_TEMP/foundation-plan.json"
          else
            node scripts/foundation.mjs --full --event "$EVENT_NAME" --no-note --select "$RUNNER_TEMP/foundation-plan.json"
          fi
          node --input-type=module - "$RUNNER_TEMP/foundation-plan.json" <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const plan = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const include = plan.tasks.map(task => ({
            id: task.id, kind: task.kind, go: task.kind !== 'docs',
            sandbox: ['automation', 'unit', 'e2e'].includes(task.kind),
          }));
          appendFileSync(process.env.GITHUB_OUTPUT, 'matrix=' + JSON.stringify({ include }) + '\n');
          JS
      - name: Share the selection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-plan
          path: ${{ runner.temp }}/foundation-plan.json
          if-no-files-found: error
          retention-days: 5

  checks:
    needs: selection
    if: needs.selection.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.matrix) }}
    name: ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read the Node version
        id: node
        run: |
          if [[ -f .node-version ]]; then
            printf 'version=%s\n' "$(cat .node-version)" >> "$GITHUB_OUTPUT"
          else
            echo 'version=24' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Read the Go toolchain
        if: matrix.go
        id: go
        run: |
          version=$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2; exit }' go.mod)
          if [[ -z "$version" ]]; then
            echo 'go.mod must declare a toolchain' >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        if: matrix.go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false
          cache-dependency-path: |
            go.sum
            kit/go.sum
      - name: Install actionlint
        if: matrix.kind == 'automation'
        env:
          ACTIONLINT_URL: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location "$ACTIONLINT_URL" -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - name: Install sandbox launcher
        if: matrix.sandbox
        run: |
          # Bubblewrap comes from Ubuntu; unrelated runner repositories must not gate installation.
          sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install --yes --no-install-recommends bubblewrap
          sudo install -m 0644 scripts/verify/bwrap.apparmor /etc/apparmor.d/bwrap
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          bwrap --unshare-user --unshare-pid --unshare-net --cap-drop ALL --ro-bind / / --proc /proc --dev /dev -- /bin/true
      - name: Read the shared selection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: foundation-plan
          path: ${{ runner.temp }}
      - name: Run the selected shard
        env:
          SHARD_ID: ${{ matrix.id }}
        run: node scripts/foundation.mjs --plan "$RUNNER_TEMP/foundation-plan.json" --shard "$SHARD_ID" --out "$RUNNER_TEMP/foundation-results/$SHARD_ID.json"
      - name: Share the result and package timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-result-${{ matrix.id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/foundation-results/*.json
          if-no-files-found: error
          retention-days: 5

  foundation:
    name: foundation
    if: always()
    needs: [selection, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require selection
        env:
          SELECTION_RESULT: ${{ needs.selection.result }}
        run: test "$SELECTION_RESULT" = success
      - name: Check out the candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read the Node version
        id: node
        run: |
          if [[ -f .node-version ]]; then
            printf 'version=%s\n' "$(cat .node-version)" >> "$GITHUB_OUTPUT"
          else
            echo 'version=24' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Read the selection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: foundation-plan
          path: ${{ runner.temp }}
      - name: Read shard results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: foundation-result-*
          merge-multiple: false
          path: ${{ runner.temp }}/foundation-results
      - name: Evaluate foundation
        env:
          SHARDS_RESULT: ${{ needs.checks.result }}
        run: node scripts/foundation.mjs --plan "$RUNNER_TEMP/foundation-plan.json" --results "$RUNNER_TEMP/foundation-results" --upstream "$SHARDS_RESULT" --no-note

  post-merge-qa:
    name: post-merge QA
    if: always()
    needs: [selection, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    concurrency:
      group: post-merge-qa-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Identify post-merge scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SELECTION_RESULT: ${{ needs.selection.result }}
        run: |
          enabled=false
          if [[ "$EVENT_NAME" != pull_request && "$SELECTION_RESULT" == success && ( "$REF_NAME" == dev || "$REF_NAME" == qa/e2e-* ) ]]; then
            enabled=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
      - name: Check out the tested head
        if: steps.scope.outputs.enabled == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        if: steps.scope.outputs.enabled == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Read the selection
        if: steps.scope.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: foundation-plan
          path: ${{ runner.temp }}
      - name: Read shard results
        if: steps.scope.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: foundation-result-*
          merge-multiple: false
          path: ${{ runner.temp }}/foundation-results
      - name: Reconcile e2e QA issues
        if: steps.scope.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          QA_MILESTONE: ${{ vars.QA_MILESTONE }}
        run: node scripts/verify/post-merge-qa.mjs --plan "$RUNNER_TEMP/foundation-plan.json" --results "$RUNNER_TEMP/foundation-results"
