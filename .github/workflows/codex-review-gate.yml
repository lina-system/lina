name: Merge gates

# Sets three commit statuses on a pull request's head commit, all required by the dev ruleset
# (docs/ci.md): "Codex review" (the Codex reviewer looked at this head and left no P0/P1
# finding on it), "Linked issue" (the body closes an open issue of this repository, or the
# pull request carries the `no-issue` label) and "dev green" (the latest dev push CI passed, or
# this is a `dev-red-fix` pull request that removes dev's red and adds none, or the owner set
# `dev-red-approved`).
# Judged by scripts/ci/codex_review_gate.py.
#
# pull_request_target, not pull_request: the run uses the workflow and the gate script from dev,
# so a pull request cannot edit the gate that judges it. Nothing from the pull request is
# checked out or run. Codex edits one summary comment per pull request when it finishes a
# review without findings, hence issue_comment `edited`. A finished CI run (a dev push, or a
# pull request's own checks) changes "dev green" for every open pull request, so workflow_run
# rejudges them all.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    branches: [dev]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: [CI]
    types: [completed]
  # The merge queue waits for every required check on its own merge commit, these three included.
  # The script still checks itself out from dev, so the queued change cannot rewrite the verdict.
  merge_group:
    types: [checks_requested]
    branches: [dev]

permissions: {}

concurrency:
  group: merge-gates-${{ github.event.merge_group.head_ref || github.event.pull_request.number || github.event.issue.number || 'all' }}
  cancel-in-progress: false

jobs:
  gates:
    name: Set merge gate statuses
    if: >-
      github.event_name == 'workflow_run' || github.event_name == 'merge_group' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
      (github.event_name != 'issue_comment' && github.event.pull_request.base.ref == 'dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci/codex_review_gate.py
          sparse-checkout-cone-mode: false

      - name: Judge and set the statuses
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          QUEUE_SHA: ${{ github.event.merge_group.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$QUEUE_REF" ]; then WHICH=(--merge-group "$QUEUE_REF" --sha "$QUEUE_SHA")
          elif [ -n "$PR" ]; then WHICH=(--pr "$PR"); else WHICH=(--all); fi
          python3 scripts/ci/codex_review_gate.py --repo "$REPO" "${WHICH[@]}" --target-url "$RUN_URL"
