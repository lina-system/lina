# SPDX-License-Identifier: AGPL-3.0-only
name: uv.lock check

# LINA CI (docs/ci.md). Runs on pull requests into dev or main and on pushes to dev.
# GitHub-hosted runners only; no upstream organisation secrets, runners or apps.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # uv.lock agrees with pyproject.toml (upstream uv-lockfile-check.yml).
    name: uv.lock check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: ./.github/actions/setup-pm
        with:
          cache-python: true
          prune-python-cache: true

      - name: Verify uv.lock is up to date
        run: |
          # The check re-resolves against PyPI; retry so a registry blip is not read as a stale lock.
          for delay in 5 15 45; do
            if python -m pm.build_env --source . --check-lock > lock-check.log 2>&1; then
              cat lock-check.log; rm -f lock-check.log; exit 0
            fi
            cat lock-check.log
            grep -q "Request failed after" lock-check.log || { rm -f lock-check.log; echo "::error::uv.lock is out of date: run 'hermes pm lock'"; exit 1; }
            sleep "$delay"
          done
          rm -f lock-check.log
          echo "::error::could not reach the package registry"
          exit 1

      - name: Check the checkout is clean
        uses: ./.github/actions/check-clean-worktree
