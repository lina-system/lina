name: Labels

# Matches this repository's labels to labels.yml in lina-system/.github and keeps
# ready/blocked, kind, size and runner labels in line with each issue. See
# https://github.com/lina-system/.github/blob/main/scripts/issue_labels.py for the rules.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: labels
  cancel-in-progress: false

jobs:
  labels:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/issue_labels.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Match labels to labels.yml
        if: github.event_name != 'issues'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.3
          python .github/scripts/issue_labels.py sync

      - name: Update issue labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ "$EVENT_NAME" = issues ]; then
            python .github/scripts/issue_labels.py issues --issue "$ISSUE"
          else
            python .github/scripts/issue_labels.py issues --all-comments
          fi
