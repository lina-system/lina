# Work endpoints the app reads: goals, work cards, their worker runs and the owner inbox.
# Served by plugins/kanban/dashboard/work_api.py under /api/plugins/kanban/work, behind the
# dashboard auth gate (session token). lina-app's scripts/generate-client.mjs can point
# SCHEMA_SOURCE at this file. tests/plugins/test_kanban_work_api.py validates served JSON
# against it, so a shape change here and in the code land together.
openapi: 3.0.3
info:
  title: LINA work API
  version: 0.1.0
  description: >
    Goals (goal cards with their work cards and the evidence that closed them), work cards
    (summary and detail), the result records of runs (lina#527) and the owner inbox with one write: answer an
    item as the owner.
    A work card is a goal-mode kanban card, any card whose body has a `## To-dos` section, or any
    blocked or triage card (lina#664); a goal card above it, when there is one, is its link-child. Times are Unix epoch seconds.
servers:
  - url: /api/plugins/kanban
paths:
  /work/goals:
    get:
      operationId: listWorkGoals
      summary: Goal cards with their work cards and evidence.
      parameters:
        - $ref: "#/components/parameters/Board"
      responses:
        "200":
          description: Goal list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalList"
  /work/goals/{id}:
    get:
      operationId: getWorkGoal
      summary: One goal card.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Board"
      responses:
        "200":
          description: The goal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkGoal"
        "404":
          description: No such card, or the card is not a goal card.
  /work/cards:
    get:
      operationId: listWorkCards
      summary: Work cards, optionally for one agent or in one state.
      parameters:
        - name: agent
          in: query
          required: false
          description: The agent that did the card (its implementer), the value the summary's `agent` carries.
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/WorkState"
        - $ref: "#/components/parameters/Board"
        - name: finished_limit
          in: query
          required: false
          description: >-
            Serve only this many done cards, newest completion first, after skipping `finished_offset` (lina#729).
            Every unfinished card is always served. With this or `finished_offset` the reply carries `finishedTotal`;
            with neither the reply is unchanged.
          schema:
            type: integer
            minimum: 0
        - name: finished_offset
          in: query
          required: false
          description: Done cards to skip, newest completion first, before `finished_limit` applies (all of the rest without it).
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Work card summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkCardList"
        "400":
          description: Unknown state.
        "422":
          description: "`finished_limit` or `finished_offset` is not a whole number of zero or more."
  /work/cards/{id}:
    get:
      operationId: getWorkCard
      summary: One card with to-dos, worker runs, gate results, comments and runs.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Board"
      responses:
        "200":
          description: Card detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkCardDetail"
        "404":
          description: No such card.
  /work/artifacts:
    get:
      operationId: findArtifacts
      summary: The result records at a Desk path or under a Desk folder, with their runs, to-dos and goals.
      parameters:
        - name: path
          in: query
          required: true
          description: A Desk path (`Areas/Dev/G1/OT-.../plan.md`) or folder (`Areas/Dev/G1`); a `desk:` prefix is accepted.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: What touches the path; empty lists when nothing does.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactLookup"
        "503":
          description: The work record cannot be read.
  /work/inbox:
    get:
      operationId: getWorkInbox
      summary: Blocked cards and unanswered owner questions.
      parameters:
        - $ref: "#/components/parameters/Board"
      responses:
        "200":
          description: Inbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inbox"
  /work/inbox/{id}/answer:
    post:
      operationId: answerWorkInboxItem
      summary: Comment on the card as the owner; unblock it when it is blocked for input.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Board"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequest"
      responses:
        "200":
          description: The answer was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResult"
        "400":
          description: Empty text, or the author is the card's assignee.
        "404":
          description: No such card.
  # Reports (lina#263): served by hermes_cli/web_routers/lina_reports.py under /api/lina, behind the same dashboard
  # auth gate. tests/hermes_cli/test_lina_reports_api.py validates served JSON against these schemas. An update is
  # announced on GET /api/lina/events as source `reports` (docs/api/board-client.yaml ChangeEvent).
  /reports:
    servers:
      - url: /api/lina
    get:
      operationId: listReports
      summary: Reports, newest change first, optionally of one work card and one goal (no bodies).
      parameters:
        - name: card
          in: query
          required: false
          description: Only reports of this work card (the id `/work/cards/{id}` takes).
          schema:
            type: string
        - name: goal
          in: query
          required: false
          description: Only reports of this goal.
          schema:
            type: string
      responses:
        "200":
          description: The reports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportList"
        "503":
          description: The store cannot be read.
  /reports/{id}:
    servers:
      - url: /api/lina
    get:
      operationId: getReport
      summary: One report with its newest body, or with one earlier version's.
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: version
          in: query
          required: false
          description: Show this version's title, summary and body instead of the newest.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          description: No such report or version, or a private report and the request is not the owner's session.
        "503":
          description: The store cannot be read.
  /reports/{id}/page:
    servers:
      - url: /
    get:
      operationId: getReportPage
      summary: >
        The report as a plain HTML page, for a browser that opens the link a chat message carries. Its newest
        version; it reloads itself every 30 s. Raw HTML in the body is shown as text, only http(s), mailto and
        same-site addresses are kept, and the Content-Security-Policy allows no script.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The page.
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Not signed in; to the dashboard sign-in, which returns here (the dashboard's auth gate).
        "404":
          description: No such report, or a private report and the request is not the owner's session.
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Board:
      name: board
      in: query
      required: false
      description: Kanban board slug; omit for the current board.
      schema:
        type: string
  schemas:
    ReadOnly:
      type: boolean
      description: >
        Present and true on items of the read-only hermes source (lina#481): a card of the Hermes Agent board,
        read through its CLI. Their ids start with "hermes:"; the answer route refuses them with 409.
    Detail:
      type: boolean
      description: >
        Present and false on a done card of the hermes source that ended outside the app's done window (lina#533):
        it is the board's list row alone, without comments, events or runs.
    HermesAt:
      type: number
      nullable: true
      description: >
        Present only while the hermes source is set (lina#533): when the served Hermes rows were read, in epoch
        seconds; null before the first read ended. The board is read in the background, never in the request.
    SourceErrors:
      type: array
      description: >
        Present while the hermes source is set (lina#481), on replies for the default board, and on a card list whose
        work record failed to read (`work`, lina#666): one entry per source that failed to read; the rows of the
        other sources are served.
      items:
        type: object
        required: [source, message]
        properties:
          source:
            type: string
          message:
            type: string
    WorkState:
      type: string
      description: >
        planned (triage, todo, scheduled, ready); in_progress (running with a live run);
        waiting (review, or a gate still waiting with exit 75); stopped (blocked, or running
        with no live run); done.
      enum:
        - planned
        - in_progress
        - waiting
        - stopped
        - done
    Reason:
      type: string
      nullable: true
      description: >
        One word after the state, when there is one: the column for planned; review or gate
        for waiting; for stopped, unresponsive (running with no live run), or what the latest block
        event says (lina#629), in the store's reason words. By the event's kind (else the card's
        block kind): needs_input decision, capability feedback, transient hold, dependency
        blocked_by_item; a block that records a wait (wait_for) blocked_by_item when it waits on
        another card or its review, else hold. An untyped block by its text: gate or budget for the
        goal loop's stops; an owner-inbox line `<agent> · <kind> · <summary>` by its kind
        (갈림길 and 질문 decision, 검토 review, 돈·바깥 and 끝 조건 feedback); any other sentence decision
        when it ends with a question mark, else feedback. Null when the card has no block event
        and no block kind.
    Ask:
      type: string
      nullable: true
      maxLength: 60
      description: >
        The owner's one line on a card stopped on them (`waitingOn: owner`, lina#690): the first sentence of the latest
        block event's reason (an owner-inbox line's summary), without card ids (`t_…`, `hermes:t_…`), run ids (`OT-…`)
        and URLs, cut to 60 characters with an ellipsis. Null on every other card, and when nothing Korean is left (an
        English-only reason).
    WaitingOn:
      type: string
      nullable: true
      description: >
        Who has to act next on a stopped card (lina#629): owner when a person has to answer or act
        (decision, feedback, review, hold, gate, budget above); null when nobody has to (a block that
        waits on another card, a recorded wait the dispatcher wakes, or a card with no block event),
        and on every card that is not blocked. `agent:<name>` is the run shape of the same field
        (board-client.yaml, RunCard).
      example: owner
    Retry:
      type: string
      nullable: true
      enum: [scheduled, none, null]
      description: >
        Whether the core will start the card again by itself (lina#629): scheduled for a card in the
        scheduled column and a stopped card whose block resumes by itself (a recorded
        wait); none for a stopped card that waits on a person; null when unknown (a card
        that is not blocked, or one with no block event).
    Agent:
      type: string
      nullable: true
      description: >
        The agent that did the card — its implementer, not its reviewer: `request_review` moves the
        board's assignee to the reviewer, so the implementer comes from the card's own runs and its
        review requests (lina#290). A reviewed card is listed under this agent, and the `agent` filter
        counts by it.
    Reviewer:
      type: string
      nullable: true
      description: >
        The agent that reviewed the card; present only when a review run exists, and never a substitute
        for `agent`.
    TodoProgress:
      type: object
      additionalProperties: false
      required: [done, total]
      properties:
        done:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    PlainLines:
      type: object
      additionalProperties: false
      description: >
        Checked model-written lines (lina#151). A field that failed its check, or was never written, is null; the
        raw source text is never served in its place.
      required: [title, now, result]
      properties:
        title:
          type: string
          nullable: true
          maxLength: 25
        now:
          type: string
          nullable: true
          maxLength: 60
        result:
          type: string
          nullable: true
          maxLength: 80
    WorkCardSummary:
      type: object
      additionalProperties: false
      required: [id, title, goalTitle, agent, state, reason, elapsedSeconds, todoProgress, now, plain]
      properties:
        readOnly:
          $ref: "#/components/schemas/ReadOnly"
        detail:
          $ref: "#/components/schemas/Detail"
        id:
          type: string
        title:
          type: string
        goalTitle:
          type: string
          nullable: true
          description: >
            The title of the work record's goal whose goal or to-do links this card (`kanban:<card>`, lina#666); a
            Hermes board card (`hermes:<id>`) by its raw id, linked without a board or on the Hermes source's board
            (lina#690). Null when no record item links it, when the record cannot be read (then `errors` names `work`
            on the list), and on a LINA board goal's `workCards`, where the goal row is the goal.
        agent:
          $ref: "#/components/schemas/Agent"
        reviewer:
          $ref: "#/components/schemas/Reviewer"
        state:
          $ref: "#/components/schemas/WorkState"
        reason:
          $ref: "#/components/schemas/Reason"
        waitingOn:
          $ref: "#/components/schemas/WaitingOn"
        retry:
          $ref: "#/components/schemas/Retry"
        ask:
          $ref: "#/components/schemas/Ask"
        elapsedSeconds:
          type: integer
          minimum: 0
        todoProgress:
          $ref: "#/components/schemas/TodoProgress"
        now:
          type: string
          nullable: true
          maxLength: 120
          description: The latest comment or heartbeat note, plain text.
        plain:
          $ref: "#/components/schemas/PlainLines"
        endedAt:
          type: integer
          nullable: true
          description: When a done card was completed (epoch seconds); null for any other state.
        lastHeartbeatAt:
          type: integer
          nullable: true
          description: The card's latest heartbeat (epoch seconds), from its heartbeat columns or events; null when it never beat.
    WorkCardList:
      type: object
      additionalProperties: false
      required: [cards]
      properties:
        errors:
          $ref: "#/components/schemas/SourceErrors"
        hermesAt:
          $ref: "#/components/schemas/HermesAt"
        finishedTotal:
          type: integer
          minimum: 0
          description: >-
            Every done card the filters select, whatever the page; present only when `finished_limit` or
            `finished_offset` was given.
        cards:
          type: array
          items:
            $ref: "#/components/schemas/WorkCardSummary"
    Todo:
      type: object
      additionalProperties: false
      required: [id, title, kind, done]
      properties:
        id:
          type: string
          description: owner/repo#n for an issue; check-N for a checklist item.
        title:
          type: string
        kind:
          type: string
          enum: [issue, check]
        done:
          type: boolean
    Artifact:
      type: object
      additionalProperties: false
      description: >
        One result file of a worker run, tied to the run's to-do and goal (lina#527). `kind` starts as `draft` for
        every file a run leaves in `out/`; only the owner's acceptance makes it `final`. `repo` and `commit` stay
        null until the forge (lina#448); until then `path` is the file's Desk path,
        `<area folder>/<goal id>/<run id>/<file>` (a to-do with no goal: `<Inbox folder>/<to-do id>/<run id>/<file>`);
        a record keeps that path when its area is renamed or its goal moves.
      required: [id, run, task, goal, repo, path, commit, kind, createdAt]
      properties:
        id:
          type: integer
        run:
          type: string
          description: The worker run (`OT-...`) that wrote the file.
        task:
          type: string
          nullable: true
          description: The run's to-do in the work record (`T..`).
        goal:
          type: string
          nullable: true
          description: The goal of the run or of its to-do (`G..`).
        repo:
          type: string
          nullable: true
        path:
          type: string
        commit:
          type: string
          nullable: true
        kind:
          type: string
          enum: [draft, final]
        createdAt:
          type: integer
    ArtifactLookup:
      type: object
      additionalProperties: false
      required: [path, artifacts, runs, tasks, goals]
      properties:
        path:
          type: string
          description: The path asked for, without a `desk:` prefix or surrounding slashes.
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"
        runs:
          type: array
          items:
            type: string
        tasks:
          type: array
          items:
            type: string
        goals:
          type: array
          items:
            type: string
    WorkerRun:
      type: object
      additionalProperties: false
      required: [id, kind, firstSeenAt, lastSeenAt, artifacts]
      properties:
        artifacts:
          type: array
          description: The run's result records.
          items:
            $ref: "#/components/schemas/Artifact"
        id:
          type: string
        kind:
          type: string
          enum: [omo, quick-issue, lina-worker]
        firstSeenAt:
          type: integer
        lastSeenAt:
          type: integer
    RunAwaitingVerdict:
      type: object
      additionalProperties: false
      required: [id, state, waitingOn]
      properties:
        id:
          type: string
        state:
          type: string
          description: The run's state in the hub (running, done, review, failed, ...), or unknown.
        waitingOn:
          type: string
          description: "`agent:<name>`: the agent whose verdict the run waits for."
    GateResult:
      type: object
      additionalProperties: false
      required: [command, exitCode, passed, waiting, outputTail, at]
      properties:
        command:
          type: string
        exitCode:
          type: integer
          nullable: true
        passed:
          type: boolean
        waiting:
          type: boolean
          description: The gate exited 75 (still waiting).
        outputTail:
          type: string
        at:
          type: integer
    Comment:
      type: object
      additionalProperties: false
      required: [id, author, body, createdAt]
      properties:
        id:
          type: integer
        author:
          type: string
        body:
          type: string
        createdAt:
          type: integer
    CardRun:
      type: object
      additionalProperties: false
      required: [id, profile, status, outcome, startedAt, endedAt, lastHeartbeatAt, summary, live]
      properties:
        id:
          type: integer
        profile:
          type: string
          nullable: true
        status:
          type: string
        outcome:
          type: string
          nullable: true
        startedAt:
          type: integer
        endedAt:
          type: integer
          nullable: true
        lastHeartbeatAt:
          type: integer
          nullable: true
        summary:
          type: string
          nullable: true
        live:
          type: boolean
    WorkCardDetail:
      type: object
      additionalProperties: false
      required: [id, title, goalTitle, agent, state, reason, elapsedSeconds, todoProgress, now, plain,
                 todos, workerRuns, runsAwaitingVerdict, gates, comments, runs, artifacts]
      properties:
        readOnly:
          $ref: "#/components/schemas/ReadOnly"
        detail:
          $ref: "#/components/schemas/Detail"
        id:
          type: string
        title:
          type: string
        goalTitle:
          type: string
          nullable: true
          description: >
            The title of the work record's goal whose goal or to-do links this card (`kanban:<card>`, lina#666); a
            Hermes board card (`hermes:<id>`) by its raw id, linked without a board or on the Hermes source's board
            (lina#690). Null when no record item links it, when the record cannot be read (then `errors` names `work`
            on the list), and on a LINA board goal's `workCards`, where the goal row is the goal.
        agent:
          $ref: "#/components/schemas/Agent"
        reviewer:
          $ref: "#/components/schemas/Reviewer"
        state:
          $ref: "#/components/schemas/WorkState"
        reason:
          $ref: "#/components/schemas/Reason"
        waitingOn:
          $ref: "#/components/schemas/WaitingOn"
        retry:
          $ref: "#/components/schemas/Retry"
        ask:
          $ref: "#/components/schemas/Ask"
        elapsedSeconds:
          type: integer
          minimum: 0
        todoProgress:
          $ref: "#/components/schemas/TodoProgress"
        now:
          type: string
          nullable: true
          maxLength: 120
        plain:
          $ref: "#/components/schemas/PlainLines"
        endedAt:
          type: integer
          nullable: true
          description: When a done card was completed (epoch seconds); null for any other state.
        lastHeartbeatAt:
          type: integer
          nullable: true
          description: The card's latest heartbeat (epoch seconds), from its heartbeat columns or events; null when it never beat.
        todos:
          type: array
          items:
            $ref: "#/components/schemas/Todo"
        workerRuns:
          type: array
          items:
            $ref: "#/components/schemas/WorkerRun"
        runsAwaitingVerdict:
          type: array
          description: Runs this card started with no verdict yet; each waits on an agent, never on the owner.
          items:
            $ref: "#/components/schemas/RunAwaitingVerdict"
        gates:
          type: array
          description: The latest result per gate command.
          items:
            $ref: "#/components/schemas/GateResult"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/CardRun"
        artifacts:
          type: array
          description: Result records of the record's to-dos and goals that link this card (`kanban:<card>`).
          items:
            $ref: "#/components/schemas/Artifact"
    Evidence:
      type: object
      additionalProperties: false
      required: [cardId, title, summary, metadata, completedAt]
      properties:
        cardId:
          type: string
        title:
          type: string
        summary:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        completedAt:
          type: integer
          nullable: true
    WorkGoal:
      type: object
      additionalProperties: false
      required: [id, title, agent, state, reason, elapsedSeconds, workCards, evidence, artifacts]
      properties:
        readOnly:
          $ref: "#/components/schemas/ReadOnly"
        detail:
          $ref: "#/components/schemas/Detail"
        id:
          type: string
        title:
          type: string
        agent:
          $ref: "#/components/schemas/Agent"
        reviewer:
          $ref: "#/components/schemas/Reviewer"
        state:
          $ref: "#/components/schemas/WorkState"
        reason:
          $ref: "#/components/schemas/Reason"
        elapsedSeconds:
          type: integer
          minimum: 0
        workCards:
          type: array
          items:
            $ref: "#/components/schemas/WorkCardSummary"
        evidence:
          type: array
          description: Completion summary and metadata of the goal card and its done work cards.
          items:
            $ref: "#/components/schemas/Evidence"
        artifacts:
          type: array
          description: Result records of the goal card and of its work cards, as on a card.
          items:
            $ref: "#/components/schemas/Artifact"
    GoalList:
      type: object
      additionalProperties: false
      required: [goals]
      properties:
        errors:
          $ref: "#/components/schemas/SourceErrors"
        hermesAt:
          $ref: "#/components/schemas/HermesAt"
        goals:
          type: array
          items:
            $ref: "#/components/schemas/WorkGoal"
    InboxBlocked:
      type: object
      additionalProperties: false
      required: [cardId, title, agent, state, reason, blockKind, blockReason]
      properties:
        readOnly:
          $ref: "#/components/schemas/ReadOnly"
        cardId:
          type: string
        title:
          type: string
        agent:
          $ref: "#/components/schemas/Agent"
        reviewer:
          $ref: "#/components/schemas/Reviewer"
        state:
          $ref: "#/components/schemas/WorkState"
        reason:
          $ref: "#/components/schemas/Reason"
        blockKind:
          type: string
          nullable: true
          enum: [dependency, needs_input, capability, transient, null]
        blockReason:
          type: string
          nullable: true
    InboxQuestion:
      type: object
      additionalProperties: false
      required: [cardId, title, agent, commentId, body, askedAt]
      properties:
        readOnly:
          $ref: "#/components/schemas/ReadOnly"
        cardId:
          type: string
        title:
          type: string
        agent:
          $ref: "#/components/schemas/Agent"
        reviewer:
          $ref: "#/components/schemas/Reviewer"
        commentId:
          type: integer
        body:
          type: string
        askedAt:
          type: integer
    Inbox:
      type: object
      additionalProperties: false
      required: [blocked, questions]
      properties:
        errors:
          $ref: "#/components/schemas/SourceErrors"
        hermesAt:
          $ref: "#/components/schemas/HermesAt"
        blocked:
          type: array
          items:
            $ref: "#/components/schemas/InboxBlocked"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/InboxQuestion"
    AnswerRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
        author:
          type: string
          default: owner
    ReportSummary:
      type: object
      additionalProperties: false
      description: >
        One report without its body. The app's report card (lina-app#50) shows `title`, `summary`, `agent`,
        `updatedAt` and `version`, and opens `page` or GET /reports/{id}.
      required: [id, title, summary, agent, card, goal, private, version, createdAt, updatedAt, page]
      properties:
        id:
          type: string
          description: rep_ and 12 hex digits.
        title:
          type: string
        summary:
          type: string
          description: One line, the line the chat shows.
        agent:
          type: string
          description: The agent that wrote it.
        card:
          type: string
          nullable: true
        goal:
          type: string
          nullable: true
        private:
          type: boolean
          description: Written from the owner's private material; served only to the owner's session.
        version:
          type: integer
          description: The newest version's number (1 for a report never edited).
        createdAt:
          type: integer
        updatedAt:
          type: integer
        page:
          type: string
          description: The page's path on this server (GET /reports/{id}/page).
    ReportList:
      type: object
      additionalProperties: false
      required: [reports]
      properties:
        reports:
          type: array
          items:
            $ref: "#/components/schemas/ReportSummary"
    ReportVersion:
      type: object
      additionalProperties: false
      required: [version, at, title, summary]
      properties:
        version:
          type: integer
        at:
          type: integer
        title:
          type: string
        summary:
          type: string
    Report:
      type: object
      additionalProperties: false
      description: >
        A report: the ReportSummary fields, the body of `shownVersion` (markdown; `title` and `summary` are that
        version's too) and every version's number, time and line.
      required: [id, title, summary, agent, card, goal, private, version, createdAt, updatedAt, page, body,
                 shownVersion, versions]
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
        agent:
          type: string
        card:
          type: string
          nullable: true
        goal:
          type: string
          nullable: true
        private:
          type: boolean
        version:
          type: integer
        createdAt:
          type: integer
        updatedAt:
          type: integer
        page:
          type: string
        body:
          type: string
        shownVersion:
          type: integer
        versions:
          type: array
          items:
            $ref: "#/components/schemas/ReportVersion"
    ReportReference:
      type: string
      pattern: "^\\[\\[report:rep_[0-9a-f]{12}\\|[^|\\s]+\\|.+\\]\\]$"
      description: >
        A chat message's reference to a report: a line of its own, `[[report:<id>|<page address>|<summary>]]`,
        that the `report` tool returns (gateway/report_reference.py). Fields: `id` the report's id, `page` the page
        address (the dashboard's public URL and /reports/{id}/page), `summary` its one line. A client with
        report cards shows a card for the line and reads GET /reports/{id}; a platform without cards (Telegram)
        sends the summary line and the page link instead. The report's body is never in the message.
    AnswerResult:
      type: object
      additionalProperties: false
      required: [ok, cardId, commentId, unblocked, state, reason]
      properties:
        ok:
          type: boolean
        cardId:
          type: string
        commentId:
          type: integer
        unblocked:
          type: boolean
        state:
          $ref: "#/components/schemas/WorkState"
        reason:
          $ref: "#/components/schemas/Reason"
