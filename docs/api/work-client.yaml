# Work endpoints the app reads: goals, work cards, their worker runs and the owner inbox.
# Served by plugins/kanban/dashboard/work_api.py under /api/plugins/kanban/work, behind the
# dashboard auth gate (session token). lina-app's scripts/generate-client.mjs can point
# SCHEMA_SOURCE at this file. tests/plugins/test_kanban_work_api.py validates served JSON
# against it, so a shape change here and in the code land together.
openapi: 3.0.3
info:
  title: LINA work API
  version: 0.1.0
  description: >
    Goals (goal cards with their work cards and the evidence that closed them), work cards
    (summary and detail), and the owner inbox with one write: answer an item as the owner.
    A work card is a goal-mode kanban card, or any card whose body has a `## To-dos` section;
    a goal card above it, when there is one, is its link-child. Times are Unix epoch seconds.
servers:
  - url: /api/plugins/kanban
paths:
  /work/goals:
    get:
      operationId: listWorkGoals
      summary: Goal cards with their work cards and evidence.
      parameters:
        - $ref: "#/components/parameters/Board"
      responses:
        "200":
          description: Goal list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalList"
  /work/goals/{id}:
    get:
      operationId: getWorkGoal
      summary: One goal card.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Board"
      responses:
        "200":
          description: The goal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkGoal"
        "404":
          description: No such card, or the card is not a goal card.
  /work/cards:
    get:
      operationId: listWorkCards
      summary: Work cards, optionally for one agent or in one state.
      parameters:
        - name: agent
          in: query
          required: false
          description: The agent that did the card (its implementer), the value the summary's `agent` carries.
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/WorkState"
        - $ref: "#/components/parameters/Board"
      responses:
        "200":
          description: Work card summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkCardList"
        "400":
          description: Unknown state.
  /work/cards/{id}:
    get:
      operationId: getWorkCard
      summary: One card with to-dos, worker runs, gate results, comments and runs.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Board"
      responses:
        "200":
          description: Card detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkCardDetail"
        "404":
          description: No such card.
  /work/inbox:
    get:
      operationId: getWorkInbox
      summary: Blocked cards and unanswered owner questions.
      parameters:
        - $ref: "#/components/parameters/Board"
      responses:
        "200":
          description: Inbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inbox"
  /work/inbox/{id}/answer:
    post:
      operationId: answerWorkInboxItem
      summary: Comment on the card as the owner; unblock it when it is blocked for input.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Board"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequest"
      responses:
        "200":
          description: The answer was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResult"
        "400":
          description: Empty text, or the author is the card's assignee.
        "404":
          description: No such card.
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Board:
      name: board
      in: query
      required: false
      description: Kanban board slug; omit for the current board.
      schema:
        type: string
  schemas:
    ReadOnly:
      type: boolean
      description: >
        Present and true on items of the read-only hermes source (lina#481): a card of the Hermes Agent board,
        read through its CLI. Their ids start with "hermes:"; the answer route refuses them with 409.
    Detail:
      type: boolean
      description: >
        Present and false on a done card of the hermes source that ended outside the app's done window (lina#533):
        it is the board's list row alone, without comments, events or runs.
    HermesAt:
      type: number
      nullable: true
      description: >
        Present only while the hermes source is set (lina#533): when the served Hermes rows were read, in epoch
        seconds; null before the first read ended. The board is read in the background, never in the request.
    SourceErrors:
      type: array
      description: >
        Present only while the hermes source is set (lina#481), on replies for the default board: one entry per
        source that failed to read; the rows of the other sources are served.
      items:
        type: object
        required: [source, message]
        properties:
          source:
            type: string
          message:
            type: string
    WorkState:
      type: string
      description: >
        planned (triage, todo, scheduled, ready); in_progress (running with a live run);
        waiting (review, or a gate still waiting with exit 75); stopped (blocked, or running
        with no live run); done.
      enum:
        - planned
        - in_progress
        - waiting
        - stopped
        - done
    Reason:
      type: string
      nullable: true
      description: >
        One word after the state, when there is one: the column for planned; review or gate
        for waiting; for stopped, unresponsive (running with no live run), or what the latest block
        event says (lina#629), in the store's reason words. By the event's kind (else the card's
        block kind): needs_input decision, capability feedback, transient hold, dependency
        blocked_by_item; a block that records a wait (wait_for) blocked_by_item when it waits on
        another card or its review, else hold. An untyped block by its text: gate or budget for the
        goal loop's stops; an owner-inbox line `<agent> · <kind> · <summary>` by its kind
        (갈림길 and 질문 decision, 검토 review, 돈·바깥 and 끝 조건 feedback); any other sentence decision
        when it ends with a question mark, else feedback. Null when the card has no block event
        and no block kind.
    WaitingOn:
      type: string
      nullable: true
      description: >
        Who has to act next on a stopped card (lina#629): owner when a person has to answer or act
        (decision, feedback, review, hold, gate, budget above); null when nobody has to (a block that
        waits on another card, a recorded wait the dispatcher wakes, or a card with no block event),
        and on every card that is not blocked. `agent:<name>` is the run shape of the same field
        (board-client.yaml, RunCard).
      example: owner
    Retry:
      type: string
      nullable: true
      enum: [scheduled, none, null]
      description: >
        Whether the core will start the card again by itself (lina#629): scheduled for a card in the
        scheduled column and a stopped card whose block resumes by itself (a recorded
        wait); none for a stopped card that waits on a person; null when unknown (a card
        that is not blocked, or one with no block event).
    Agent:
      type: string
      nullable: true
      description: >
        The agent that did the card — its implementer, not its reviewer: `request_review` moves the
        board's assignee to the reviewer, so the implementer comes from the card's own runs and its
        review requests (lina#290). A reviewed card is listed under this agent, and the `agent` filter
        counts by it.
    Reviewer:
      type: string
      nullable: true
      description: >
        The agent that reviewed the card; present only when a review run exists, and never a substitute
        for `agent`.
    TodoProgress:
      type: object
      additionalProperties: false
      required: [done, total]
      properties:
        done:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    PlainLines:
      type: object
      additionalProperties: false
      description: >
        Checked model-written lines (lina#151). A field that failed its check, or was never written, is null; the
        raw source text is never served in its place.
      required: [title, now, result]
      properties:
        title:
          type: string
          nullable: true
          maxLength: 25
        now:
          type: string
          nullable: true
          maxLength: 60
        result:
          type: string
          nullable: true
          maxLength: 80
    WorkCardSummary:
      type: object
      additionalProperties: false
      required: [id, title, agent, state, reason, elapsedSeconds, todoProgress, now, plain]
      properties:
        readOnly:
          $ref: "#/components/schemas/ReadOnly"
        detail:
          $ref: "#/components/schemas/Detail"
        id:
          type: string
        title:
          type: string
        agent:
          $ref: "#/components/schemas/Agent"
        reviewer:
          $ref: "#/components/schemas/Reviewer"
        state:
          $ref: "#/components/schemas/WorkState"
        reason:
          $ref: "#/components/schemas/Reason"
        waitingOn:
          $ref: "#/components/schemas/WaitingOn"
        retry:
          $ref: "#/components/schemas/Retry"
        elapsedSeconds:
          type: integer
          minimum: 0
        todoProgress:
          $ref: "#/components/schemas/TodoProgress"
        now:
          type: string
          nullable: true
          maxLength: 120
          description: The latest comment or heartbeat note, plain text.
        plain:
          $ref: "#/components/schemas/PlainLines"
        endedAt:
          type: integer
          nullable: true
          description: When a done card was completed (epoch seconds); null for any other state.
        lastHeartbeatAt:
          type: integer
          nullable: true
          description: The card's latest heartbeat (epoch seconds), from its heartbeat columns or events; null when it never beat.
    WorkCardList:
      type: object
      additionalProperties: false
      required: [cards]
      properties:
        errors:
          $ref: "#/components/schemas/SourceErrors"
        hermesAt:
          $ref: "#/components/schemas/HermesAt"
        cards:
          type: array
          items:
            $ref: "#/components/schemas/WorkCardSummary"
    Todo:
      type: object
      additionalProperties: false
      required: [id, title, kind, done]
      properties:
        id:
          type: string
          description: owner/repo#n for an issue; check-N for a checklist item.
        title:
          type: string
        kind:
          type: string
          enum: [issue, check]
        done:
          type: boolean
    WorkerRun:
      type: object
      additionalProperties: false
      required: [id, kind, firstSeenAt, lastSeenAt]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [omo, quick-issue, lina-worker]
        firstSeenAt:
          type: integer
        lastSeenAt:
          type: integer
    RunAwaitingVerdict:
      type: object
      additionalProperties: false
      required: [id, state, waitingOn]
      properties:
        id:
          type: string
        state:
          type: string
          description: The run's state in the hub (running, done, review, failed, ...), or unknown.
        waitingOn:
          type: string
          description: "`agent:<name>`: the agent whose verdict the run waits for."
    GateResult:
      type: object
      additionalProperties: false
      required: [command, exitCode, passed, waiting, outputTail, at]
      properties:
        command:
          type: string
        exitCode:
          type: integer
          nullable: true
        passed:
          type: boolean
        waiting:
          type: boolean
          description: The gate exited 75 (still waiting).
        outputTail:
          type: string
        at:
          type: integer
    Comment:
      type: object
      additionalProperties: false
      required: [id, author, body, createdAt]
      properties:
        id:
          type: integer
        author:
          type: string
        body:
          type: string
        createdAt:
          type: integer
    CardRun:
      type: object
      additionalProperties: false
      required: [id, profile, status, outcome, startedAt, endedAt, lastHeartbeatAt, summary, live]
      properties:
        id:
          type: integer
        profile:
          type: string
          nullable: true
        status:
          type: string
        outcome:
          type: string
          nullable: true
        startedAt:
          type: integer
        endedAt:
          type: integer
          nullable: true
        lastHeartbeatAt:
          type: integer
          nullable: true
        summary:
          type: string
          nullable: true
        live:
          type: boolean
    WorkCardDetail:
      type: object
      additionalProperties: false
      required: [id, title, agent, state, reason, elapsedSeconds, todoProgress, now, plain,
                 todos, workerRuns, runsAwaitingVerdict, gates, comments, runs]
      properties:
        readOnly:
          $ref: "#/components/schemas/ReadOnly"
        detail:
          $ref: "#/components/schemas/Detail"
        id:
          type: string
        title:
          type: string
        agent:
          $ref: "#/components/schemas/Agent"
        reviewer:
          $ref: "#/components/schemas/Reviewer"
        state:
          $ref: "#/components/schemas/WorkState"
        reason:
          $ref: "#/components/schemas/Reason"
        waitingOn:
          $ref: "#/components/schemas/WaitingOn"
        retry:
          $ref: "#/components/schemas/Retry"
        elapsedSeconds:
          type: integer
          minimum: 0
        todoProgress:
          $ref: "#/components/schemas/TodoProgress"
        now:
          type: string
          nullable: true
          maxLength: 120
        plain:
          $ref: "#/components/schemas/PlainLines"
        endedAt:
          type: integer
          nullable: true
          description: When a done card was completed (epoch seconds); null for any other state.
        lastHeartbeatAt:
          type: integer
          nullable: true
          description: The card's latest heartbeat (epoch seconds), from its heartbeat columns or events; null when it never beat.
        todos:
          type: array
          items:
            $ref: "#/components/schemas/Todo"
        workerRuns:
          type: array
          items:
            $ref: "#/components/schemas/WorkerRun"
        runsAwaitingVerdict:
          type: array
          description: Runs this card started with no verdict yet; each waits on an agent, never on the owner.
          items:
            $ref: "#/components/schemas/RunAwaitingVerdict"
        gates:
          type: array
          description: The latest result per gate command.
          items:
            $ref: "#/components/schemas/GateResult"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/CardRun"
    Evidence:
      type: object
      additionalProperties: false
      required: [cardId, title, summary, metadata, completedAt]
      properties:
        cardId:
          type: string
        title:
          type: string
        summary:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        completedAt:
          type: integer
          nullable: true
    WorkGoal:
      type: object
      additionalProperties: false
      required: [id, title, agent, state, reason, elapsedSeconds, workCards, evidence]
      properties:
        readOnly:
          $ref: "#/components/schemas/ReadOnly"
        detail:
          $ref: "#/components/schemas/Detail"
        id:
          type: string
        title:
          type: string
        agent:
          $ref: "#/components/schemas/Agent"
        reviewer:
          $ref: "#/components/schemas/Reviewer"
        state:
          $ref: "#/components/schemas/WorkState"
        reason:
          $ref: "#/components/schemas/Reason"
        elapsedSeconds:
          type: integer
          minimum: 0
        workCards:
          type: array
          items:
            $ref: "#/components/schemas/WorkCardSummary"
        evidence:
          type: array
          description: Completion summary and metadata of the goal card and its done work cards.
          items:
            $ref: "#/components/schemas/Evidence"
    GoalList:
      type: object
      additionalProperties: false
      required: [goals]
      properties:
        errors:
          $ref: "#/components/schemas/SourceErrors"
        hermesAt:
          $ref: "#/components/schemas/HermesAt"
        goals:
          type: array
          items:
            $ref: "#/components/schemas/WorkGoal"
    InboxBlocked:
      type: object
      additionalProperties: false
      required: [cardId, title, agent, state, reason, blockKind, blockReason]
      properties:
        readOnly:
          $ref: "#/components/schemas/ReadOnly"
        cardId:
          type: string
        title:
          type: string
        agent:
          $ref: "#/components/schemas/Agent"
        reviewer:
          $ref: "#/components/schemas/Reviewer"
        state:
          $ref: "#/components/schemas/WorkState"
        reason:
          $ref: "#/components/schemas/Reason"
        blockKind:
          type: string
          nullable: true
          enum: [dependency, needs_input, capability, transient, null]
        blockReason:
          type: string
          nullable: true
    InboxQuestion:
      type: object
      additionalProperties: false
      required: [cardId, title, agent, commentId, body, askedAt]
      properties:
        readOnly:
          $ref: "#/components/schemas/ReadOnly"
        cardId:
          type: string
        title:
          type: string
        agent:
          $ref: "#/components/schemas/Agent"
        reviewer:
          $ref: "#/components/schemas/Reviewer"
        commentId:
          type: integer
        body:
          type: string
        askedAt:
          type: integer
    Inbox:
      type: object
      additionalProperties: false
      required: [blocked, questions]
      properties:
        errors:
          $ref: "#/components/schemas/SourceErrors"
        hermesAt:
          $ref: "#/components/schemas/HermesAt"
        blocked:
          type: array
          items:
            $ref: "#/components/schemas/InboxBlocked"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/InboxQuestion"
    AnswerRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
        author:
          type: string
          default: owner
    AnswerResult:
      type: object
      additionalProperties: false
      required: [ok, cardId, commentId, unblocked, state, reason]
      properties:
        ok:
          type: boolean
        cardId:
          type: string
        commentId:
          type: integer
        unblocked:
          type: boolean
        state:
          $ref: "#/components/schemas/WorkState"
        reason:
          $ref: "#/components/schemas/Reason"
