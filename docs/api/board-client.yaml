          description: Kanban card ids linked from the item or its to-dos.
          items:
            type: string
        decision:
          allOf:
            - $ref: "#/components/schemas/Decision"
          nullable: true
        ownerDone:
          allOf:
            - $ref: "#/components/schemas/OwnerDone"
          nullable: true
    ChangeEvent:
      type: object
      additionalProperties: false
      description: One change; no item body (refetch the snapshot it touches).
      required: [source, kind, id, at]
      properties:
        source:
          type: string
          enum: [work, worker, kanban, settings]
          description: >
            work = the work record's event table; worker = a `lina worker` run state change (hub receipts);
            kanban = a kanban task event; settings = a work settings revision (`docs/api/settings-client.yaml`).
        kind:
          type: string
          description: The store's own event kind (work event kind, worker receipt kind, kanban task event kind).
        id:
          type: string
          description: The item, run or card the event is about.
        at:
          type: integer
          nullable: true
    ChangeBatch:
      type: object
      additionalProperties: false
      required: [cursor, events]
      properties:
        cursor:
          type: string
          description: Opaque; send it back as since= to resume after a reconnect.
        events:
          type: array
          items:
            $ref: "#/components/schemas/ChangeEvent"
    ChangeResync:
      type: object
      additionalProperties: false
      required: [cursor, resync]
      properties:
        cursor:
          type: string
        resync:
          type: boolean
          enum: [true]
          description: >
            The since cursor was unreadable or older than the kept history, or a store that could not be read when
            the cursor was taken reads again (what it wrote meanwhile is not known); refetch every snapshot.
    ChangeMessage:
      description: >
        A message of the change stream (lina#150). GET /api/lina/events is a WebSocket, not a JSON route (OpenAPI
        cannot describe it as a path): upgrade with the dashboard credential (?token=, as the other dashboard
        sockets) and optional since=<cursor>. Without since the first message is a ChangeBatch with the tail cursor
        and no events; with a kept since it is the missed events; otherwise one ChangeResync. Then a ChangeBatch
        whenever something changed, at most every 300 ms, and one ChangeResync when a store that was down when the
        cursor was taken reads again.
      oneOf:
        - $ref: "#/components/schemas/ChangeBatch"
        - $ref: "#/components/schemas/ChangeResync"
    ActionResult:
      type: object
      additionalProperties: false
      required: [ok, id, state, reason, cid, undoUntil]
      properties:
        ok:
          type: boolean
        id:
          type: string
        state:
          $ref: "#/components/schemas/WorkState"
        reason:
          type: string
          nullable: true
        cid:
          type: string
          nullable: true
          description: The comment written (comments, answers, retries).
        undoUntil:
          type: integer
          nullable: true
          description: While the owner's done mark can be undone.
    ReadResult:
      type: object
      additionalProperties: false
      required: [ok, unread]
      properties:
        ok:
          type: boolean
        unread:
          type: integer
          minimum: 0
    Refusal:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: One line.
    StatusCheck:
      type: object
      additionalProperties: false
      required: [name, ok, line, at, staleAfter, stale, state, file]
      properties:
        name:
          type: string
          description: The check's own name from its status file; a malformed file falls back to the file stem.
        ok:
          type: boolean
          description: What the check last reported; always false for an error row.
        line:
          type: string
          description: >
            One line for the owner; for an error row, the file name, a colon and a short reason. Text that is not
            valid UTF-8 (a lone surrogate) is malformed, so no served text fails to encode.
        at:
          type: number
          description: >
            Unix epoch seconds the check last wrote (a malformed file's mtime). A file whose `at` is not a finite
            number is malformed, so no served `at` is ever NaN or Infinity.
        staleAfter:
          type: number
          minimum: 0
          nullable: true
          description: Seconds after `at` the check is stale; null for an error row. A negative value is malformed.
        stale:
          type: boolean
          description: True when `now - at > staleAfter`.
        state:
          type: string
          enum: [ok, failing, stale, error]
          description: >
            stale when `now - at > staleAfter` (wins over ok/failing); failing when `ok` is false; error for a
            malformed file (bad JSON, a bad field, a non-finite or negative time, text that is not valid UTF-8).
        file:
          type: string
          description: >
            The status file's name under `<LINA root>/status/`; bytes that are not UTF-8 are served as U+FFFD.
    StatusChecks:
      type: object
      additionalProperties: false
      required: [version, at, checks]
      properties:
        version:
          type: integer
          enum: [1]
        at:
          type: number
          description: When the folder was read, Unix epoch seconds.
        checks:
          type: array
          description: Newest `at` first.
          items:
            $ref: "#/components/schemas/StatusCheck"
