# Board endpoints the app reads beyond docs/api/work-client.yaml (lina#112): the owner's to-dos, decisions and due
# groups from the work record, `lina worker` runs that are not kanban work cards, devices, quota and the inbox
# notices; each agent's goals and to-dos (lina#166); one worker run's record, round by round (lina#201); the owner's
# writes and read marks (lina#149); the
# change stream's messages (lina#150, a WebSocket: see ChangeMessage). Served by hermes_cli/web_routers/lina_board.py
# behind the dashboard auth gate (session token).
# tests/hermes_cli/test_lina_board_api.py validates served JSON against it, so a shape change here and in the code
# land together. WorkState is the same enum as work-client.yaml.
openapi: 3.0.3
info:
  title: LINA board API
  version: 0.1.0
  description: >
    The parts of the board snapshot lina#112 does not serve. Every response carries an ETag of its data (the
    snapshot time `at` left out); send it back as If-None-Match to get 304 while nothing changed. A source that
    fails to read is listed in `errors` and the counts made from it are null, never 0. Times are Unix epoch seconds;
    due dates are YYYY-MM-DD days on the owner's calendar (`work.timezone`).
servers:
  - url: /api/lina
paths:
  /board:
    get:
      operationId: getBoard
      summary: One snapshot of the to-dos, decisions, due groups, worker run cards, devices, quota and notices.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The snapshot.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardSnapshot"
        "304":
          description: Unchanged since the ETag sent.
  /work/due:
    get:
      operationId: getWorkDue
      summary: Open goals and to-dos with a due date, grouped.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Due groups.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DueView"
        "304":
          description: Unchanged since the ETag sent.
  /devices:
    get:
      operationId: getDevices
      summary: The work devices (devices.workers) with readiness, load and, with a metrics reader, usage.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Devices.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicesView"
        "304":
          description: Unchanged since the ETag sent.
  /quota:
    get:
      operationId: getQuota
      summary: Quota per service from LINA's OCX, with the burn rate of each window.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Quota.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaView"
        "304":
          description: Unchanged since the ETag sent.
  /work/items:
    get:
      operationId: listWorkItems
      summary: Every open goal and to-do plus those closed in the last three days (lina#166).
      parameters:
        - name: agent
          in: query
          required: false
          description: Only the items that answer to this agent.
          schema:
            type: string
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The goals and to-dos; a record that fails to read is in errors and items is empty.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemList"
        "304":
          description: Unchanged since the ETag sent.
  /work/items/{id}:
    get:
      operationId: getWorkItem
      summary: One goal or to-do with the owner's words, children, comments, runs, links and decision (lina#166).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The item.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDetail"
        "304":
          description: Unchanged since the ETag sent.
        "404":
          description: No such goal or to-do (an unknown id, an area, a memo or a dropped item).
        "503":
          description: The work record failed to read.
  /work/runs/{id}/record:
    get:
      operationId: getWorkRunRecord
      summary: One lina worker run's own record, round by round, newest round first (lina#201).
      description: >
        The run's session record lives on the build device that ran it and the hub cannot read it, so the record is
        made of what the hub keeps: its receipts (each round's start and own end, the owner's verdict notes and
        cancel reasons), the last fetched final message and report (an earlier round's are replaced by the next
        fetch), and for the round going now the runner's live view (its recent sentences and tool steps; only its
        last line from a device that does not send them). The sentences of a round that ended before the last
        fetch are not on the hub and are not served.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The run's record.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunRecord"
        "304":
          description: Unchanged since the ETag sent.
        "404":
          description: No such worker run (an unknown or malformed id).
  /work/items/{id}/done:
    post:
      operationId: markWorkItemDone
      summary: The owner marks a goal or to-do done (owner-done --via app).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                withOpen:
                  type: boolean
                  description: Close a goal's open to-dos with it (else 409 while any is open).
      responses:
        "200":
          description: "Done: the item's state after the write."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "400":
          $ref: "#/components/responses/Refused"
        "404":
          $ref: "#/components/responses/Refused"
        "409":
          $ref: "#/components/responses/Refused"
        "429":
          $ref: "#/components/responses/Refused"
  /work/items/{id}/undo:
    post:
      operationId: undoWorkItemDone
      summary: Undo the owner's done mark within ten minutes (owner-undo --via app).
      responses:
        "200":
          description: "Done: the item's state after the write."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "400":
          $ref: "#/components/responses/Refused"
        "404":
          $ref: "#/components/responses/Refused"
        "409":
          $ref: "#/components/responses/Refused"
        "429":
          $ref: "#/components/responses/Refused"
  /work/items/{id}/comments:
    post:
      operationId: commentWorkItem
      summary: The owner comments, or answers the item's open decision (comment --via app).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: 1-2000 characters after trimming.
                answer:
                  type: boolean
                  description: An answer to the open decision (else 409 when there is none).
      responses:
        "200":
          description: "Done: the item's state after the write."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "400":
          $ref: "#/components/responses/Refused"
        "404":
          $ref: "#/components/responses/Refused"
        "409":
          $ref: "#/components/responses/Refused"
        "429":
          $ref: "#/components/responses/Refused"
  /work/items/{id}/retry:
    post:
      operationId: retryWorkItem
      summary: "A comment asking the owning agent to retry; nothing is re-run by the core."
      responses:
        "200":
          description: "Done: the item's state after the write."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "400":
          $ref: "#/components/responses/Refused"
        "404":
          $ref: "#/components/responses/Refused"
        "409":
          $ref: "#/components/responses/Refused"
        "429":
          $ref: "#/components/responses/Refused"
  /work/add:
    post:
      operationId: addWorkItem
      summary: "Quick add: one line to a chosen agent (add 메모 --by <agent> --via app)."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [agent, text]
              properties:
                agent:
                  type: string
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: 1-2000 characters after trimming.
                due:
                  type: string
                  nullable: true
                  description: YYYY-MM-DD.
      responses:
        "200":
          description: "Done: the item's state after the write."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "400":
          $ref: "#/components/responses/Refused"
        "429":
          $ref: "#/components/responses/Refused"
  /notices/read:
    post:
      operationId: readNotices
      summary: Mark notices read for the owner (kept by the core, the same on every device).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                keys:
                  type: array
                  minItems: 1
                  items:
                    type: string
                all:
                  type: boolean
      responses:
        "200":
          description: "Done: the item's state after the write."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadResult"
        "400":
          $ref: "#/components/responses/Refused"
        "429":
          $ref: "#/components/responses/Refused"
        "503":
          $ref: "#/components/responses/Refused"
components:
  responses:
    Refused:
      description: Refused; nothing was written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Refusal"
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
  headers:
    ETag:
      description: Tag of the data; send back as If-None-Match.
      schema:
        type: string
  schemas:
    WorkState:
      type: string
      description: >
        Same enum as work-client.yaml. For a worker run: planned (new, queued); in_progress (running);
        waiting (a finished run with no verdict yet, or a run that asked a person); stopped (failed, stalled,
        no result, cancelled, rejected); done (accepted).
      enum:
        - planned
        - in_progress
        - waiting
        - stopped
        - done
    SourceError:
      type: object
      required: [source, message]
      properties:
        source:
          type: string
          enum: [work, worker, devices, metrics, quota]
        message:
          type: string
    Errors:
      type: array
      items:
        $ref: "#/components/schemas/SourceError"
    Count:
      type: integer
      minimum: 0
      nullable: true
      description: The length of the list it labels; null when its source failed to read.
    Counts:
      type: object
      required: [inbox, running, stopped, due, done, agents, unread]
      properties:
        unread:
          $ref: "#/components/schemas/Count"
        inbox:
          $ref: "#/components/schemas/Count"
        running:
          $ref: "#/components/schemas/Count"
        stopped:
          $ref: "#/components/schemas/Count"
        due:
          $ref: "#/components/schemas/Count"
        done:
          $ref: "#/components/schemas/Count"
        agents:
          type: object
          nullable: true
          description: Running cards per agent (configured agents with none read 0).
          additionalProperties:
            type: integer
            minimum: 0
    PlainLines:
      type: object
      additionalProperties: false
      description: >
        Checked model-written lines (lina#151). A field that failed its check, or was never written, is null; the
        raw source text is never served in its place.
      required: [title, now, result]
      properties:
        title:
          type: string
          nullable: true
          maxLength: 25
        now:
          type: string
          nullable: true
          maxLength: 60
        result:
          type: string
          nullable: true
          maxLength: 80
    RunCard:
      type: object
      required: [id, title, state, reason, agent, kind, todo, host, startedAt, endedAt, now, plain]
      properties:
        id:
          type: string
        title:
          type: string
        state:
          $ref: "#/components/schemas/WorkState"
        reason:
          type: string
          nullable: true
          description: >
            planned: new, queued; waiting: review, decision; stopped: failed, unresponsive, result_missing,
            cancelled, rejected.
        agent:
          type: string
          nullable: true
        kind:
          type: string
          nullable: true
          description: The run's mode (ulw, research, mass, mass-research).
        todo:
          type: string
          nullable: true
          description: The work record to-do the run takes on.
        host:
          type: string
          nullable: true
        startedAt:
          type: number
          nullable: true
        endedAt:
          type: number
          nullable: true
        now:
          type: string
          nullable: true
          description: What the run does now, from the runner's live state (at most 120 characters).
        plain:
          $ref: "#/components/schemas/PlainLines"
    RecordRow:
      type: object
      additionalProperties: false
      required: [at, kind, text, count]
      properties:
        at:
          type: number
          description: When it was said or done; a folded row's first step.
        kind:
          type: string
          enum: [said, tools, comment]
          description: >
            said: the run's own sentence; tools: the tool steps between two sentences folded into one row;
            comment: the owner's words (a verdict note, a cancel reason).
        text:
          type: string
          nullable: true
          description: Null on a tools row, which never carries tool names, paths, commands or ids.
        count:
          type: integer
          minimum: 1
          description: A tools row's steps; a said row's times the same sentence was said in a row; 1 on a comment.
    RecordRound:
      type: object
      additionalProperties: false
      required: [run, startedAt, endedAt, endKnown, startUnknown, result, verdict, stopped, rows]
      description: >
        One run of the task, from its own start to its own end. A row belongs to the round going at its time; a
        row after a round's end and before the next round's start belongs to none.
      properties:
        run:
          type: integer
          nullable: true
          description: The round's run number; null on the round whose start fell out of the kept history.
        startedAt:
          type: number
          nullable: true
        endedAt:
          type: number
          nullable: true
          description: From the round's own end receipt only; null while it goes or when its end is not on record.
        endKnown:
          type: boolean
        startUnknown:
          type: boolean
          description: The round's start fell out of the kept history; such a round is served only with content.
        result:
          type: string
          nullable: true
          description: The report's first line, on the round going when it was written; never on a round going now.
        verdict:
          type: string
          nullable: true
          enum: [accepted, rejected, null]
          description: The owner's verdict, on the latest round that began before it.
        stopped:
          type: boolean
          description: The round's own end says it stopped (stalled, failed, cancelled, no result, unreachable).
        rows:
          type: array
          description: Oldest first.
          items:
            $ref: "#/components/schemas/RecordRow"
    RunRecord:
      type: object
      additionalProperties: false
      required: [id, at, rounds, comments, errors]
      properties:
        id:
          type: string
        at:
          type: number
          description: Snapshot time (left out of the ETag).
        rounds:
          type: array
          description: Newest round first.
          items:
            $ref: "#/components/schemas/RecordRound"
        comments:
          type: array
          description: Comments made while no round was going, newest first; each stands on its own.
          items:
            $ref: "#/components/schemas/RecordRow"
        errors:
          $ref: "#/components/schemas/Errors"
    ItemRow:
      type: object
      required: [id, kind, title, due, agent]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [goal, todo]
        title:
          type: string
        due:
          type: string
          nullable: true
        agent:
          type: string
          nullable: true
    MineRow:
      type: object
      required: [id, title, waiting, due, agent]
      properties:
        id:
          type: string
        title:
          type: string
        waiting:
          type: boolean
          description: The to-do still waits on an open item, a hold or a wait sentence.
        due:
          type: string
          nullable: true
        agent:
          type: string
          nullable: true
          description: The agent that asked for the to-do.
    DecideRow:
      type: object
      required: [target, title, agent, kind, text, at, answered]
      properties:
        target:
          type: string
          description: The work record item the decision is aimed at.
        title:
          type: string
        agent:
          type: string
          nullable: true
        kind:
          type: string
          enum: [ask, act]
          description: ask = the owner picks; act = the owner does something (a sprint's owner line).
        text:
          type: string
        at:
          type: integer
        answered:
          type: boolean
          description: The owner answered and the agent has not replied yet.
    Inbox:
      type: object
      required: [decide, review, mine]
      properties:
        decide:
          type: array
          items:
            $ref: "#/components/schemas/DecideRow"
        review:
          type: array
          description: Ids of run cards waiting on the owner.
          items:
            type: string
        mine:
          type: array
          items:
            $ref: "#/components/schemas/MineRow"
    DueGroups:
      type: object
      required: [overdue, today, week, later]
      properties:
        overdue:
          type: array
          items:
            $ref: "#/components/schemas/ItemRow"
        today:
          type: array
          items:
            $ref: "#/components/schemas/ItemRow"
        week:
          type: array
          items:
            $ref: "#/components/schemas/ItemRow"
        later:
          type: array
          items:
            $ref: "#/components/schemas/ItemRow"
    Notice:
      type: object
      required: [key, target, at, kind, line, read]
      properties:
        key:
          type: string
          description: kind:target:time; a new key is a new notice.
        target:
          type: string
        at:
          type: number
          nullable: true
        kind:
          type: string
          enum: [ask, review, todo]
        line:
          type: string
          description: One line in the work record's locale.
        read:
          type: boolean
          description: The owner marked it read (kept by the core per owner, the same on every device).
    Machine:
      type: object
      required: [name, state, why, cpu, memory, disk, temp, load, cores, running, cap, freeGb, metricsAt]
      properties:
        name:
          type: string
        state:
          type: string
          enum: [ok, warn, down]
        why:
          type: string
          nullable: true
          enum: [unreachable, runner, service, disk, over, down, cpu, memory, temp, pending, quiet, null]
        cpu:
          type: number
          nullable: true
        memory:
          type: number
          nullable: true
        disk:
          type: number
          nullable: true
        temp:
          type: number
          nullable: true
        load:
          type: number
          nullable: true
        cores:
          type: integer
          nullable: true
        running:
          type: integer
          nullable: true
        cap:
          type: integer
        freeGb:
          type: integer
          nullable: true
        metricsAt:
          type: number
          nullable: true
    QuotaWindow:
      type: object
      required: [key, percent, resetAt, ratePerHour, warn]
      properties:
        key:
          type: string
          description: weekly, fiveHour, monthly, or custom:<OCX label>.
        percent:
          type: number
        resetAt:
          type: number
          nullable: true
        ratePerHour:
          type: number
          nullable: true
          description: Percent per hour over the last three hours of this reset period; null under 30 minutes of records.
        warn:
          type: boolean
          description: At this rate the window reaches 100% before it resets.
    QuotaAccount:
      type: object
      required: [id, number, plan, paused, unavailable, windows, mainWindow, warn]
      properties:
        id:
          type: string
          description: A hash of the OCX account id.
        number:
          type: integer
          description: The account's place in its service (1, 2, ...).
        plan:
          type: string
        paused:
          type: boolean
        unavailable:
          type: boolean
        windows:
          type: array
          items:
            $ref: "#/components/schemas/QuotaWindow"
        mainWindow:
          type: string
          nullable: true
        warn:
          type: boolean
    QuotaService:
      type: object
      required: [service, percent, ratePerHour, accounts]
      properties:
        service:
          type: string
        percent:
          type: number
          nullable: true
        ratePerHour:
          type: number
          nullable: true
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/QuotaAccount"
    BoardSnapshot:
      type: object
      required: [version, at, errors, counts, cards, inbox, due, notices, machines, quota, writer]
      properties:
        version:
          type: integer
        at:
          type: number
        errors:
          $ref: "#/components/schemas/Errors"
        counts:
          $ref: "#/components/schemas/Counts"
        cards:
          type: array
          items:
            $ref: "#/components/schemas/RunCard"
        inbox:
          $ref: "#/components/schemas/Inbox"
        due:
          $ref: "#/components/schemas/DueGroups"
        notices:
          type: array
          items:
            $ref: "#/components/schemas/Notice"
        machines:
          type: array
          items:
            $ref: "#/components/schemas/Machine"
        quota:
          type: array
          items:
            $ref: "#/components/schemas/QuotaService"
        writer:
          type: object
          additionalProperties: false
          description: >
            The writer of the checked lines (lina#151). never = it has not run yet; stopped = its calls failed, or
            work was left to write and nothing succeeded for 30 minutes (the app says the summaries stopped).
          required: [state, lastSuccessAt, stoppedSince]
          properties:
            state:
              type: string
              enum: [ok, stopped, never]
            lastSuccessAt:
              type: integer
              nullable: true
            stoppedSince:
              type: integer
              nullable: true
    DueView:
      type: object
      required: [version, at, errors, today, count, due]
      properties:
        version:
          type: integer
        at:
          type: number
        errors:
          $ref: "#/components/schemas/Errors"
        today:
          type: string
          nullable: true
        count:
          $ref: "#/components/schemas/Count"
        due:
          $ref: "#/components/schemas/DueGroups"
    DevicesView:
      type: object
      required: [version, at, errors, machines]
      properties:
        version:
          type: integer
        at:
          type: number
        errors:
          $ref: "#/components/schemas/Errors"
        machines:
          type: array
          items:
            $ref: "#/components/schemas/Machine"
    QuotaView:
      type: object
      required: [version, at, errors, quota]
      properties:
        version:
          type: integer
        at:
          type: number
        errors:
          $ref: "#/components/schemas/Errors"
        quota:
          type: array
          items:
            $ref: "#/components/schemas/QuotaService"
    Person:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    TodoCount:
      type: object
      additionalProperties: false
      required: [done, total]
      properties:
        done:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    ItemSummary:
      type: object
      additionalProperties: false
      required: [id, kind, parent, title, agent, addedBy, mine, state, reason, stateSince, lastActivityAt,
                 createdAt, closedAt, due, doneCondition, area, projects, todos, runCount, commentCount]
      properties:
        id:
          type: string
          description: G12, T40
        kind:
          type: string
