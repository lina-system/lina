# `lina worker` settings in the LINA root's config.yaml (lina#35). Copy what you need; nothing here is required
# except the device list, without which no device is bid on.

devices:
  workers:                                   # the work devices the hub bids over (`lina worker hosts`)
    build-a: {host: build-a, cap: 2, fast: true}      # host: an ssh alias the hub reaches the device by
    build-b: {host: build-b, cap: 2}
    docs-box: {host: docs-box, cap: 1, no_repo: true} # takes no repo work
    here: {host: local, cap: 1, last: true}           # this machine, only when the others are full
    lab: {host: lab, cap: 1, auto: false}             # only when named with --host
    files: {host: files, kind: file, role: files,     # a file node over ssh, no LINA on it (docs/file-node.md)
            omo: "~/.bun/bin/omo", deny: [/volume1/backup, "#recycle", "#snapshot", "@*"], volumes: [/volume1]}
    phone: {host: phone, role: person}                # role person: never takes work

worker:
  hub: {host: hub, lina: lina}               # how a device reaches the hub to report an end (ssh alias, lina there)
  notice:
    command: [notify-agent, "{agent}"]       # the end notice for the agent's chat, body on stdin
  runner_sync: {at: "04:00", notify: default}  # the hub's daily `lina runners sync` after this local time (off
                                             # when unset); its notice goes to `notify` (docs/lina-runners.md)
  card_link: {kind: hermes, command: [/path/to/hermes]}  # runs from Hermes cards end on the card: the Hermes Agent
                                             # CLI by absolute path (a bare `hermes` is LINA's own alias)
  todo_link: {kind: hermes, command: [my-todo]}  # runs `link|evidence|note <to-do> ...` for --todo; unset = none
  hub_rules: "- This machine is the hub: never open secrets or the owner's private records."  # host: local runs
  default_runner: omo
  # Requested access defaults to workspace-write. An agent needs an explicit full ceiling for full access.
  access: {reviewer: read-only, builder: workspace-write}
  models:
    aliases:                                 # names for --model; ids are in magpie's catalog form <provider>/<id>
      planner: {provider: claude, id: planning-model-id, thinking: medium}
      builder: {provider: codex, id: implementation-model-id, thinking: high}
    defaults:                                # by mode: planning-heavy work and long implementation
      research: planner
      mass-research: planner
      ulw: builder
      mass: builder
  proxy:                                     # THIS node's local magpie, in the node's own config.yaml (lina#585);
    remote_id: hub                           # the id of its remote link to the hub (model ids read
                                             # <remote_id>/<provider>/<id>; "" on the node whose own magpie
                                             # holds them: <provider>/<id>, lina#623); health: optional address of the
                                             # proxy check (default http://127.0.0.1:3425/v1/models, lina#586);
                                             # url: optional magpie gateway for usage, quota and model screens;
                                             # key_env: optional .env variable holding a gateway key (lina#625);
                                             # service: magpie's local unit / launchd label the device
                                             # screen restarts (default magpie, lina#589).
                                             # Node setup: docs/worker-proxy-switch.md
  runners:
    omo: {type: omo}                         # built in: LINA's pinned omo (lina#34)
    claude:
      type: acp
      flavor: claude
      argv: [claude-agent-acp]                # @zed-industries/claude-agent-acp, provisioned separately
    codex:
      type: acp
      flavor: codex
      argv: [codex-acp]                       # @zed-industries/codex-acp, provisioned separately
    opencode:
      type: command
      argv: [opencode, run]
      # Configure access_args or a fixed access matching the CLI's actual permissions before use.
    # ACP runners (type acp): argv is mandatory, a list of non-empty texts; flavor is optional (grok, dsh, agy,
    # claude or codex; omitted = generic). No bypass flags: permissions are answered by the runner from the run's
    # access mode, and the client offers no fs or terminal capability.
    grok: {type: acp, flavor: grok, argv: [grok, agent, stdio]}
    dsh: {type: acp, flavor: dsh, argv: [dsh, acp]}
    agy: {type: acp, flavor: agy, argv: [agy, acp]}
    cursor-agent: {type: command, argv: [cursor-agent, -p, --force]}
  sign_in:                                   # `lina devices sign-in <node> <runner>` (docs/lina-sign-in.md)
    browser:
      command: [hub-browser-sign-in]         # the hub operator's own: address on stdin, exit 0 or 3 + needs_person
    accounts: {grok: <account>, agy: <account>}  # the account the browser command chooses, per runner
  # Limits (defaults shown): poll_s 15, stall_grace_s 600, answered_grace_s 60, background_max_s 10800,
  # hard_timeout_s 43200, min_free_gb 5, input_max_mb 300, memory_max 12G,
  # repo_url "https://github.com/{repo}.git", git_identity {name, email}, private_paths [].
